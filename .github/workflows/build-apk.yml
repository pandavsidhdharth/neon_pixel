name: Build VORTEX PLAYER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: unzip -o neon_pixel_ready_for_build.zip -d .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept licenses and install Android NDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "ndk;27.0.12077973"

      - name: Restore stable VORTEX signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vortex-player-debug-signing-v1

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-PLAYER-APK
          path: build/app/outputs/flutter-apk/app-release.apk
